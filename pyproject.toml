[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dictator-translator"
version = "1.0.0"
description = "Real-time speech translation app with floating PyQt6 interface"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "User" }
]
requires-python = ">=3.8"
dependencies = [
    "pyqt6>=6.7.0",
    "SpeechRecognition>=3.10.0",
    "pynput>=1.7.7",
    "requests>=2.31.0",
    "numpy>=1.21.0",
    "pyaudio>=0.2.14",
    "faster-whisper>=1.1.0",
    "soundfile>=0.13.1",
]

keywords = ["translation", "speech", "pyqt6", "real-time"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Desktop Environment",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
whisper = [
    "faster-whisper>=1.0.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "sentencepiece>=0.1.99",
    "numpy>=1.21.0",
    "soundfile>=0.12.1",
]
translate = [
    "googletrans==4.0.0rc1",
]
audio = [
    "PyAudio>=0.2.14",
]

[project.scripts]
dictator = "src.dictator:main"

[project.urls]
Homepage = "https://github.com/user/dictator-translator"
Repository = "https://github.com/user/dictator-translator.git"
Issues = "https://github.com/user/dictator-translator/issues"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
]

[tool.black]
line-length = 88
target-version = ['py38']

[tool.isort]
profile = "black"
multi_line_output = 3

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
